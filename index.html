<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0E1014">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="author" content="Mohamed-Eldawly">
<title>معمل اللحام الافتراضي</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-stage="hub">
<section id="viewport" aria-label="المعمل ثلاثي الأبعاد">
  <div id="hotspots"></div>
  <div id="lens" aria-hidden="true"></div>
  <div id="hud"></div>
  <div id="coach" role="status"></div>
  <div id="toast" class="toast" role="status"></div>
  <div id="hold-ui" class="glass" hidden>
    <b id="hold-name"></b>
    <span class="muted small">اسحب للّف • قرّب بإصبعين أو بالعجلة</span>
    <div class="hold-btns">
      <button type="button" class="btn" data-act="hold-spin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>لف تلقائي</button>
      <button type="button" class="btn" data-act="hold-reset"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>اعدل</button>
      <button type="button" class="btn primary" data-act="hold-return"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14l-4-4 4-4"/><path d="M5 10h10a4 4 0 0 1 0 8h-2"/></svg>رجّعه للتربيزة</button>
    </div>
  </div>
</section>

<header id="topbar">
  <div class="tb-start glass">
    <button type="button" id="tb-back" class="icon-btn" data-act="home" aria-label="رجوع للمحطات" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20l7-7"/><path d="M11 13l3-8 5 5-8 3z"/><path d="M17 17l2 2M19 14l2 1M14 19l1 2"/></svg></div>
    <div id="tb-title" class="tb-title"></div>
  </div>
  <nav id="stepper" class="glass" aria-label="مراحل المحطة" hidden></nav>
  <div class="tb-end glass">
    <button type="button" class="icon-btn voice-btn" id="tb-voice" data-act="voice" aria-label="الشرح الصوتي"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button type="button" class="icon-btn" id="tb-sound" data-act="sound" aria-label="المؤثرات الصوتية"></button>
    <button type="button" class="icon-btn tb-present" data-act="present" aria-label="تكبير الخط (وضع العرض)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
    <button type="button" class="icon-btn" data-act="full" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</header>

<aside id="drawer" class="glass" aria-label="لوحة المحطة">
  <div class="dr-head"><b id="drawer-title"></b><button type="button" class="icon-btn sm" data-act="drawer" aria-label="اقفل اللوحة"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></div>
  <div id="panel" aria-live="polite"></div>
</aside>
<button type="button" id="drawer-toggle" class="glass" data-act="drawer" aria-label="افتح اللوحة"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span>اللوحة</span></button>

<div id="rotate" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M3 12a9 9 0 0 0 4 7M21 12a9 9 0 0 0-4-7"/></svg><b>لف الموبايل بالعرض</b><span>المعمل مصمم يشتغل بعرض الشاشة زي الألعاب</span><button type="button" data-act="rotate-skip">كمّل بالطول</button></div>
<div id="loading"><div class="spin"></div><b>بنجهّز المعمل…</b><small>تحميل المجسمات والخامات</small><small class="credit-l" dir="ltr">Designed &amp; developed by Mohamed-Eldawly</small></div>
<div id="credit" dir="ltr" aria-label="Designed and developed by Mohamed-Eldawly">Designed &amp; developed by <b>Mohamed-Eldawly</b></div>
<script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0E1014">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>معمل اللحام الافتراضي</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-stage="hub">
<div id="app">
  <header id="topbar">
    <div class="tb-start">
      <button type="button" id="tb-back" class="icon-btn" data-act="home" aria-label="رجوع للمعمل" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20l7-7"/><path d="M11 13l3-8 5 5-8 3z"/><path d="M17 17l2 2M19 14l2 1M14 19l1 2"/></svg></div>
      <div id="tb-title" class="tb-title"></div>
    </div>
    <nav id="stepper" aria-label="مراحل المحطة" hidden></nav>
    <div class="tb-end">
      <button type="button" class="icon-btn" id="tb-sound" data-act="sound" aria-label="الصوت"></button>
      <button type="button" class="btn tb-present" data-act="present"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span>وضع العرض</span></button>
      <button type="button" class="icon-btn" data-act="full" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </header>
  <main id="main">
    <aside id="panel" aria-live="polite"></aside>
    <section id="viewport" aria-label="المعمل ثلاثي الأبعاد">
      <div id="hotspots"></div>
      <div id="lens" aria-hidden="true"></div>
      <div id="hud"></div>
      <div id="coach" role="status"></div>
      <div id="toast" class="toast" role="status"></div>
      <div class="vp-hint" aria-hidden="true">اسحب للدوران • قرّب بإصبعين</div>
      <div id="rotate" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M3 12a9 9 0 0 0 4 7M21 12a9 9 0 0 0-4-7"/></svg><b>لف الموبايل بالعرض</b><span>اللحام محتاج مساحة أوسع لحركة صباعك</span></div>
    </section>
  </main>
</div>
<div id="loading"><div class="spin"></div><b>بنجهّز المعمل…</b><small>تحميل المجسمات والخامات</small></div>
<script src="app.js"></script>
</body>
</html>
